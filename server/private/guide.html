<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Guide | DEBONE</title>
<meta name="description" content="The full DEBONE guide: read it, listen to it, or download it as a PDF.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#0A0A0C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=51">
<link rel="stylesheet" href="theme-brand.css?v=56">
<link rel="stylesheet" href="guide.css?v=1">
</head>
<body class="theme-brand guide-page">
<a class="skip" href="#g-main">Skip to content</a>

<header class="g-top">
  <a class="g-back" id="g-back" href="dashboard.html"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg><span>Back to dashboard</span></a>
  <a class="logo" href="index.html" aria-label="DEBONE home">DEBONE<span>.</span></a>
  <div class="g-tabs" id="g-tabs" hidden></div>
</header>

<div class="g-wrap">
  <section class="g-hero" id="g-hero" aria-live="polite"><div class="g-skel"></div></section>
  <div class="g-layout">
    <aside class="g-toc" id="g-toc" aria-label="Contents"></aside>
    <main class="g-main" id="g-main" tabindex="-1"></main>
  </div>
</div>

<div class="g-player" id="g-player" role="region" aria-label="Voice reader" hidden>
  <div class="gp-now"><span class="gp-wave" aria-hidden="true"><i></i><i></i><i></i><i></i></span><div><small>Reading aloud</small><b id="gp-title">Starting…</b></div></div>
  <div class="gp-ctl">
    <button type="button" class="gp-btn" id="gp-prev" aria-label="Previous section" title="Previous section"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5v14M19 5l-9 7 9 7z"/></svg></button>
    <button type="button" class="gp-btn gp-main" id="gp-play" aria-label="Pause"><svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14M16 5v14"/></svg><svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4l13 8-13 8z"/></svg></button>
    <button type="button" class="gp-btn" id="gp-next" aria-label="Next section" title="Next section"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 5v14M5 5l9 7-9 7z"/></svg></button>
    <button type="button" class="gp-btn gp-stop" id="gp-stop" aria-label="Stop reading" title="Stop"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="1.5"/></svg><span>Stop</span></button>
  </div>
  <div class="gp-opt">
    <label>Speed <select id="gp-rate" aria-label="Reading speed"><option value="0.8">Slow</option><option value="1" selected>Normal</option><option value="1.2">Fast</option><option value="1.5">Faster</option></select></label>
    <label>Voice <select id="gp-voice" aria-label="Voice"></select></label>
  </div>
  <div class="gp-bar" aria-hidden="true"><i id="gp-bar"></i></div>
</div>

<div class="g-toast" id="g-toast" role="status" aria-live="polite"></div>
<script src="guide.js?v=1"></script>
</body>
</html>
